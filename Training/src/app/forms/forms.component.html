<div class="container">
<form (ngSubmit)="Onsubmit()"> 
    <div>
       <label for="name">Name:</label>
       <input type="text" id="name" [(ngModel)]="User.name" name="name">
       </div>
       <div>
       <label for="email">Email:</label>
       <input type="email" id="email" [(ngModel)]="User.email" name="email">
    </div>
    <div>
       <button class="btn btn-primary">click here</button>
    </div>
    </form>
</div>

<!-- Displaying of list using ng4 directive -->

    <div *ngIf="Submitted">
       <p>{{User.name}}</p>
       <p>{{User.email}}</p>
    </div>

<!--  ngFor directive use in angular -->
<div class="container">
    <div class="row">
        <div class="col-md-3">
        <button type="button" class="btn btn-primary btn-sm" (click)="onSubmit()">List</button>


    <div *ngFor="let item of studentDetails">
        <div *ngIf="done">
        <p>Enrolled peoples names are:{{item.name}} {{item.email}}  {{item.number}}</p>
     </div>
    </div>
</div>
</div>
